<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Il BaK | Developer & Digital Artist</title>
    <meta name="description" content="Profilo ufficiale di Il BaK: Informatico prestato all'arte. Scopri i miei progetti su GitHub e il mio portfolio digitale.">
    <meta name="keywords" content="Il BaK, informatico, arte digitale, GitHub, developer, cyberpunk design">
    <meta name="author" content="Il BaK">
    <link rel="canonical" href="https://www.ilbak.it">

    <meta property="og:title" content="Il BaK | Digital Profile">
    <meta property="og:description" content="Informatico prestato al mondo dell'arte. Esplora il mio spazio digitale.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.ilbak.it">
    <meta property="og:image" content="https://www.ilbak.it/og-image.jpg"> 

    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <style>
        :root {
            --bg-color: #050505;
            --neon-pink: #ff00ff;
            --neon-cyan: #00f3ff;
            --text-color: #e0e0e0;
            --font-main: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* Effetto Scanline */
        body::before {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            z-index: 10;
            pointer-events: none;
        }

        .container {
            border: 1px solid var(--neon-cyan);
            padding: 2rem;
            max-width: 500px;
            box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 5px var(--neon-cyan);
            background: rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 20;
        }

        h1 {
            color: var(--neon-pink);
            font-size: 2rem;
            margin-top: 0;
            text-shadow: 2px 2px var(--bg-color), 0 0 10px var(--neon-pink);
            letter-spacing: 5px;
        }

        .bio {
            line-height: 1.6;
            margin-bottom: 2rem;
            border-left: 3px solid var(--neon-pink);
            padding-left: 15px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        a {
            color: var(--neon-cyan);
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            display: inline-block;
            padding: 5px 0;
        }

        a:hover, a:focus {
            color: var(--bg-color);
            background-color: var(--neon-cyan);
            box-shadow: 0 0 20px var(--neon-cyan);
            padding-left: 10px;
            outline: none;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px var(--neon-cyan); }
            50% { box-shadow: 0 0 25px var(--neon-cyan); }
            100% { box-shadow: 0 0 15px var(--neon-cyan); }
        }

        .container {
            animation: pulse 4s infinite;
        }

        /* Accessibilità: nascondi visivamente ma lascia per screen reader */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>

    <main class="container">
        <header>
            <h1>Il BaK <span class="sr-only">Digital Profile</span></h1>
        </header>
        
        <article class="bio">
            <p>> Informatico <i>prestato</i> al mondo dell'arte</p>
        </article>

        <nav class="links" aria-label="Social links">
            <a href="https://www.ilbak.it" title="Sito ufficiale di Il BaK">[ WWW.ILBAK.IT ]</a>
            <a href="https://github.com/ilbak" title="Profilo GitHub di Il BaK" rel="me">[ GITHUB_REPO ]</a>
            <a href="mailto:ilbak@ilbak.it" aria-label="Invia una mail a Il BaK" style="color: var(--neon-pink); border: 1px solid var(--neon-pink); padding: 10px; text-align: center; margin-top: 10px;">
                CONTATTA: ilbak@ilbak.it
            </a>
        </nav>
    </main>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Il BaK",
      "url": "https://www.ilbak.it",
      "sameAs": [
        "https://github.com/ilbak"
      ],
      "jobTitle": "Informatica e Arte",
      "description": "Informatico prestato al mondo dell'arte, specializzato in sviluppo web e sperimentazione digitale."
    }
    </script>

</body>
</html>
